services:
  mariadb:
    image: mariadb:10.6
    container_name: mariadb_gestordatos
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: gestordatos
      MARIADB_USER: root
      MARIADB_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
